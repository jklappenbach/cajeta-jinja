name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Builds the library .cja on a main push; on a v* tag also publishes a GitHub
# Release and a signed publish to Olla. Logic lives in the reusable workflow.
jobs:
  release:
    uses: jklappenbach/cajeta/.github/workflows/lib-release.yml@main
    with:
      # TOOLCHAIN FLOOR — do not lower. v0.21.1 is the first release that
      # must carry two fixes this library cannot build or run without:
      #   - e9aed206: break/continue past a block-scoped owner pops its
      #     drop-chain entry (a v0.21.0-built archive embeds bitcode whose
      #     next throw walks a corrupted chain and SIGSEGVs — this repo's
      #     own error-path tests found it);
      #   - dccac568: Json.parse's tree API decodes string escapes (the
      #     tojson fixtures fail byte-compare without it).
      # If the next toolchain release ships under a different number, bump
      # this pin to it — the intent is "first release containing both".
      #
      # Raised to v0.29.0 in the 2026-09-20 fleet sweep. Nothing in this
      # library's own sources needs the new floor, and that was checked
      # rather than assumed. The suite builds and passes on the old pin
      # and on v0.29.0 alike, so we are not reaching for a fix we consume.
      # The reason to move is that a published .cja is re-checked by
      # whichever compiler the CONSUMER installs, never by the one that
      # built it, so a check added after our cut can reject an archive
      # that was green the day it shipped. That was measured here, not
      # reasoned about. v0.28.0 added CAJETA_ERROR_CAPTURED_BORROW_PARAM,
      # and it rejects the published dev.cajeta.unit 0.2.4 archive out of
      # a five line program that imports nothing from it. Rebuilding on
      # the current toolchain is what keeps cajeta-llama and cajeta-http
      # able to build against us.
      #
      # That is also why this pin and the dev.cajeta.unit peg move
      # together. Held at 0.2.4 the gate was red on v0.29.0 for exactly
      # the reason above, and the fix was not ours to make. The peg now
      # points at 0.3.0, the first cajeta-unit cut by a toolchain that
      # has the check, and the suite is green again.
      cajeta-version: v0.29.0
      # The full oracle suite: fixture corpus byte-compared against
      # Jinja2-generated references (committed), plus the direct
      # error-path and ownership tests.
      test-command: ./run-tests.sh
      test-timeout-minutes: '20'
    secrets: inherit
